<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Transportasi App</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">

    <!-- HEADER -->
    <div class="bg-blue-600 text-white p-4 flex justify-between items-center">
        <h1 class="text-xl font-bold">Dashboard Pemesanan</h1>
        <button onclick="logout()" class="bg-red-500 px-4 py-2 rounded hover:bg-red-600">
            Logout
        </button>
    </div>

    <!-- CONTENT -->
    <div class="p-6">
        <h2 class="text-lg font-semibold mb-4">Data Pemesanan</h2>

        <div class="overflow-x-auto">
            <table class="min-w-full bg-white rounded shadow">
                <thead class="bg-gray-200">
                    <tr>
                        <th class="py-2 px-4">No</th>
                        <th class="py-2 px-4">Nama</th>
                        <th class="py-2 px-4">Tujuan</th>
                        <th class="py-2 px-4">Tanggal</th>
                        <th class="py-2 px-4">Jumlah Tiket</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr>
                        <td colspan="5" class="text-center p-4">Loading...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const API_URL = "http://localhost:3001";
        const token = localStorage.getItem("token");

        // ✅ Kalau belum login, balik ke login
        if (!token) {
            alert("Silakan login dulu!");
            window.location.href = "index.html";
        }

        // ✅ Ambil data pemesanan
        async function loadData() {
            try {
                const res = await fetch(`${API_URL}/pemesanan`, {
                    headers: {
                        "Authorization": "Bearer " + token
                    }
                });

                // kalau token invalid
                if (res.status === 401 || res.status === 403) {
                    alert("Session habis, silakan login ulang!");
                    logout();
                    return;
                }

                const data = await res.json();

                const tableBody = document.getElementById("tableBody");

                if (!data.length) {
                    tableBody.innerHTML = `
                        <tr>
                            <td colspan="5" class="text-center p-4">Data kosong</td>
                        </tr>
                    `;
                    return;
                }

                tableBody.innerHTML = "";

                data.forEach((item, index) => {
                    tableBody.innerHTML += `
                        <tr class="border-t">
                            <td class="py-2 px-4 text-center">${index + 1}</td>
                            <td class="py-2 px-4">${item.nama_penumpang}</td>
                            <td class="py-2 px-4">${item.tujuan}</td>
                            <td class="py-2 px-4">${item.tanggal}</td>
                            <td class="py-2 px-4 text-center">${item.jumlah_tiket}</td>
                        </tr>
                    `;
                });

            } catch (error) {
                console.error(error);
                alert("Gagal mengambil data!");
            }
        }

        // ✅ Logout
        function logout() {
            localStorage.removeItem("token");
            window.location.href = "index.html";
        }

        // Load data saat halaman dibuka
        loadData();
    </script>

</body>
</html>
