<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Transportasi App</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
        <h2 class="text-2xl font-bold mb-6 text-center text-green-600">Daftar Akun</h2>

        <form id="registerForm" class="space-y-4">
            <input type="text" id="nama" placeholder="Nama Lengkap" class="w-full p-2 border rounded" required>
            <input type="text" id="no_hp" placeholder="Nomor HP" class="w-full p-2 border rounded" required>
            <input type="email" id="email" placeholder="Email" class="w-full p-2 border rounded" required>
            <input type="password" id="password" placeholder="Password" class="w-full p-2 border rounded" required>

            <button type="submit" class="w-full bg-green-600 text-white p-2 rounded hover:bg-green-700 transition">
                Register
            </button>
        </form>

        <div class="mt-4 text-center">
            <a href="index.html" class="text-sm text-blue-500 hover:underline">
                Sudah punya akun? Login
            </a>
        </div>
    </div>

    <script>
        const API_URL = "http://localhost:3001";

        document.getElementById("registerForm").addEventListener("submit", async (e) => {
            e.preventDefault();

            const nama = document.getElementById("nama").value.trim();
            const no_hp = document.getElementById("no_hp").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value.trim();

            if (!nama || !no_hp || !email || !password) {
                alert("Semua field wajib diisi!");
                return;
            }

            try {
                const res = await fetch(`${API_URL}/register`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ nama, email, password, no_hp })
                });

                const data = await res.json();

                if (res.ok) {
                    alert("Register berhasil! Silakan login.");
                    window.location.href = "../index.html";
                } else {
                    alert(data.message || "Register gagal");
                }

            } catch (error) {
                console.error(error);
                alert("Server tidak terhubung!");
            }
        });
    </script>

</body>
</html>
